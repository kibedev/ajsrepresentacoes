<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>JS Representações — Área de Atuação</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d0a;
    --bg-2: #11130f;
    --paper: #f4f4ee;
    --muted: #8b9082;
    --green: #b5ee3a;
    --green-deep: #2c8a14;
    --pin: #ff6b6b;
    --state-on: #1f2a17;
    --state-off: #16181a;
    --state-stroke: #22271e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ===================== SECTION ===================== */
  .area-atuacao {
    max-width: 1280px;
    margin: 0 auto;
    padding: 120px 64px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .area-content .kicker {
    font-size: 13px;
    letter-spacing: 0.28em;
    color: var(--green);
    font-weight: 700;
    margin-bottom: 28px;
  }
  .area-content h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 500;
    font-size: 64px;
    line-height: 1.05;
    margin: 0 0 22px 0;
    letter-spacing: -0.01em;
    color: #ffffff;
  }
  .area-content h2 em {
    font-style: italic;
    font-weight: 600;
    color: #ffffff;
  }
  .area-content p {
    font-size: 18px;
    line-height: 1.55;
    color: #a1a69a;
    max-width: 480px;
    margin: 0 0 38px 0;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border: 1px solid var(--state-stroke);
    border-radius: 999px;
    color: var(--green);
    background: rgba(181, 238, 58, 0.04);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }
  .chip:hover {
    background: rgba(181, 238, 58, 0.10);
    border-color: rgba(181, 238, 58, 0.4);
    transform: translateY(-1px);
  }
  .chip .pin-emoji { font-size: 14px; }

  /* ===================== MAP ===================== */
  .area-map {
    position: relative;
    aspect-ratio: 1 / 1;
    max-width: 560px;
    justify-self: end;
    width: 100%;
  }
  .area-map svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }
  .area-map::before {
    content: '';
    position: absolute;
    inset: -10% -10% -10% -10%;
    background: radial-gradient(50% 50% at 60% 50%, rgba(181, 238, 58, 0.08), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* state styles */
  .state {
    fill: var(--state-off);
    stroke: var(--state-stroke);
    stroke-width: 1;
    stroke-linejoin: round;
    transition: fill 0.3s;
  }
  .state.active {
    fill: url(#stateGradient);
    stroke: rgba(181, 238, 58, 0.5);
    stroke-width: 1.2;
  }
  .state-label {
    fill: rgba(255, 255, 255, 0.32);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    pointer-events: none;
    font-family: 'Manrope', sans-serif;
  }
  .state-label.active {
    fill: var(--green);
    font-size: 13px;
  }

  /* pins */
  .pin-group { pointer-events: none; }
  .pin-pulse {
    fill: var(--green);
    opacity: 0.25;
    transform-origin: center;
    transform-box: fill-box;
    animation: pulse 2.2s ease-out infinite;
  }
  .pin-pulse.delay-1 { animation-delay: 0.55s; }
  .pin-pulse.delay-2 { animation-delay: 1.1s; }
  @keyframes pulse {
    0%   { transform: scale(0.6); opacity: 0.55; }
    70%  { transform: scale(2.4); opacity: 0; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .pin-dot-outer { fill: var(--green); }
  .pin-dot-inner { fill: var(--bg); }

  /* coast line */
  .coast {
    fill: none;
    stroke: rgba(181, 238, 58, 0.18);
    stroke-width: 1;
    stroke-dasharray: 3 4;
  }

  /* compass-ish corner */
  .corner-label {
    fill: rgba(255,255,255,0.35);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.32em;
    font-family: 'Manrope', sans-serif;
  }

  /* ===================== Responsive ===================== */
  @media (max-width: 880px) {
    .area-atuacao {
      grid-template-columns: 1fr;
      gap: 56px;
      padding: 80px 24px;
    }
    .area-content h2 { font-size: 44px; }
    .area-map { justify-self: center; max-width: 420px; }
  }
</style>
</head>
<body>

<section class="area-atuacao">
  <div class="area-content">
    <div class="kicker">ÁREA DE ATUAÇÃO</div>
    <h2>Nordeste com <em>presença</em> de verdade</h2>
    <p>Representação ativa nos três estados com visitas frequentes e atendimento personalizado.</p>
    <div class="chips">
      <span class="chip"><span class="pin-emoji">📍</span> Pernambuco</span>
      <span class="chip"><span class="pin-emoji">📍</span> Paraíba</span>
      <span class="chip"><span class="pin-emoji">📍</span> Alagoas</span>
    </div>
  </div>

  <div class="area-map">
    <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" aria-label="Mapa do Nordeste com Pernambuco, Paraíba e Alagoas destacados">
      <defs>
        <linearGradient id="stateGradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2f4f17" />
          <stop offset="100%" stop-color="#1a2b0c" />
        </linearGradient>
        <filter id="pinGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" />
        </filter>
      </defs>

      <!-- ===== Background context states (muted) ===== -->
      <!-- Piauí -->
      <path class="state" d="M 40,80 L 130,75 L 145,180 L 130,310 L 60,330 L 40,260 Z" />
      <!-- Ceará -->
      <path class="state" d="M 130,75 L 290,65 L 360,75 L 380,175 L 350,210 L 220,215 L 145,180 Z" />
      <!-- Rio Grande do Norte -->
      <path class="state" d="M 360,75 L 470,90 L 500,135 L 490,195 L 410,205 L 380,175 Z" />
      <!-- Sergipe (small) -->
      <path class="state" d="M 340,400 L 395,395 L 405,455 L 360,470 L 335,440 Z" />
      <!-- Bahia (large) -->
      <path class="state" d="M 60,330 L 130,310 L 220,330 L 290,360 L 340,400 L 335,440 L 360,470 L 380,535 L 280,560 L 130,545 L 50,490 L 35,400 Z" />

      <!-- ===== Highlighted active states ===== -->
      <!-- Paraíba -->
      <path id="state-pb" class="state active" d="M 360,210 L 410,205 L 490,195 L 510,225 L 490,260 L 430,265 L 360,250 L 350,225 Z" />
      <!-- Pernambuco -->
      <path id="state-pe" class="state active" d="M 145,210 L 220,215 L 350,225 L 360,250 L 430,265 L 490,260 L 495,310 L 470,335 L 350,335 L 220,325 L 130,315 L 130,275 Z" />
      <!-- Alagoas -->
      <path id="state-al" class="state active" d="M 350,335 L 470,335 L 480,390 L 425,405 L 395,395 L 340,400 L 330,365 Z" />

      <!-- ===== State labels ===== -->
      <text class="state-label" x="78" y="200" text-anchor="middle">PI</text>
      <text class="state-label" x="245" y="155" text-anchor="middle">CE</text>
      <text class="state-label" x="440" y="155" text-anchor="middle">RN</text>
      <text class="state-label" x="180" y="465" text-anchor="middle">BA</text>
      <text class="state-label" x="370" y="440" text-anchor="middle">SE</text>

      <text class="state-label active" x="435" y="240" text-anchor="middle">PARAÍBA</text>
      <text class="state-label active" x="260" y="280" text-anchor="middle">PERNAMBUCO</text>
      <text class="state-label active" x="410" y="375" text-anchor="middle">ALAGOAS</text>

      <!-- ===== Decorative coast curve hint ===== -->
      <path class="coast" d="M 510,100 Q 540,200 530,300 Q 520,400 480,470" />

      <!-- ===== Pins (capital cities) ===== -->
      <!-- João Pessoa - PB -->
      <g class="pin-group" transform="translate(495, 222)">
        <circle class="pin-pulse" r="7" />
        <circle class="pin-dot-outer" r="7" />
        <circle class="pin-dot-inner" r="2.5" />
      </g>
      <text x="510" y="226" class="state-label active" style="font-size:11px; letter-spacing:0.12em;">João Pessoa</text>

      <!-- Recife - PE -->
      <g class="pin-group" transform="translate(490, 295)">
        <circle class="pin-pulse delay-1" r="7" />
        <circle class="pin-dot-outer" r="7" />
        <circle class="pin-dot-inner" r="2.5" />
      </g>
      <text x="505" y="299" class="state-label active" style="font-size:11px; letter-spacing:0.12em;">Recife</text>

      <!-- Maceió - AL -->
      <g class="pin-group" transform="translate(465, 372)">
        <circle class="pin-pulse delay-2" r="7" />
        <circle class="pin-dot-outer" r="7" />
        <circle class="pin-dot-inner" r="2.5" />
      </g>
      <text x="480" y="376" class="state-label active" style="font-size:11px; letter-spacing:0.12em;">Maceió</text>

      <!-- Compass corner -->
      <g transform="translate(50, 555)">
        <text class="corner-label" x="0" y="0">NORDESTE · BR</text>
      </g>
    </svg>
  </div>
</section>

</body>
</html>
